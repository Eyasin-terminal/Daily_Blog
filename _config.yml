# Jekyll Site Configuration
# The Eyasin Arafath Brief
title: "The Eyasin Arafath Brief"
subtitle: "A daily synthesis of emerging concepts across economics, business strategy, and technology markets."
description: "A daily synthesis of emerging concepts across economics, business strategy, and technology markets."
author:
  name: "Eyasin Arafath"
  linkedin: "https://www.linkedin.com/in/eyasindataanalyst/"
  email: "eyasin.113t@gmail.com"

# GitHub Pages Settings
url: "https://<your-username>.github.io" # Replace <your-username> with your actual GitHub username (e.g., https://eyasin.github.io)
baseurl: "/Daily_Blog" # Repository subpath name for GitHub Pages

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Folder Exclusion
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - tsconfig.json
  - vite.config.ts
  - src/
  - README.md
